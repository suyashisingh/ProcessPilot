services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://processpilot:processpilot@db:5432/processpilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: processpilot
      POSTGRES_USER: processpilot
      POSTGRES_PASSWORD: processpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processpilot -d processpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
